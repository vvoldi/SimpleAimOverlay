name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check feedback validation and delivery
        run: node --test feedback-service/test/*.test.mjs
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check offsets and update behavior
        run: dotnet run --project tests/RegressionChecks.csproj
      - name: Publish UIAccess single-file app
        run: >-
          dotnet publish SimpleAimOverlay.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:UseUiAccess=true
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleAimOverlay-win-x64-unsigned
          path: bin/Release/net10.0-windows/win-x64/publish/SimpleAimOverlay.exe

